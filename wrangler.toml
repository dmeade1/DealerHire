name = "dealerhire-platform-web"
main = "src/workers/platform-web.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_NAME = "DealerHire"
LOCALE = "en"
CANDIDATE_AI_MODE = "shadow"
AD_ACTUATION_ENABLED = "false"

# Bindings are environment-specific. See docs/adr/0002-cloudflare-postgres-topology.md
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-id>"

# G1 local Next uses process-local memory store (setDefaultArtifactStore / getDefaultArtifactStore).
# Uncomment when permanent CF account + R2 Selected for G1-04 live Pass.
# Wire: createR2BucketArtifactStore(env.PUBLIC_ARTIFACTS) at platform-web / OpenNext bootstrap.
# Temp Cloudflare accounts cannot bind R2. See docs/gates/g1-04-publication-runbook.md.
# [[r2_buckets]]
# binding = "PUBLIC_ARTIFACTS"
# bucket_name = "dealerhire-public"

# [[r2_buckets]]
# binding = "PRIVATE_ARTIFACTS"
# bucket_name = "dealerhire-private"
