name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # version comes from package.json packageManager (avoid dual pin with action-setup)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm verify
      - name: Synthetic PII / false-inventory scan
        run: pnpm scan:pii
      - name: Dependency audit (fail on high+)
        run: pnpm audit --audit-level=high
      - name: SBOM + provenance
        run: |
          mkdir -p artifacts
          pnpm sbom
          echo "digest=$(git rev-parse HEAD)" > artifacts/provenance.txt
          echo "rollback_target=git:${{ github.sha }}" >> artifacts/provenance.txt
          echo "workflow_run=${{ github.run_id }}" >> artifacts/provenance.txt
          echo "ref=${{ github.ref }}" >> artifacts/provenance.txt
      - name: Rollback drill evidence (G1-14)
        run: pnpm rollback:drill
      - name: Secret scan (gitleaks via container)
        run: |
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:v8.21.2 \
            detect --source=/path --config=/path/.gitleaks.toml --verbose
      - name: ESLint security hygiene (SAST floor)
        run: pnpm lint
      - uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealerhire
          POSTGRES_PASSWORD: dealerhire
          POSTGRES_DB: dealerhire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealerhire -d dealerhire"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL_ADMIN: postgres://dealerhire:dealerhire@localhost:5432/dealerhire
      DATABASE_URL: postgres://dealerhire_app:dealerhire_app@localhost:5432/dealerhire
      CAPABILITY_SECRET: ci-capability-secret-not-for-production
      OPS_CONTROL_SECRET: ci-ops-control-secret-not-for-production
      ACCEPTANCE_ENVELOPE_BINDING: local
      DH_AUTH_MODE: hmac-g1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Apply migrations (admin)
        run: pnpm db:migrate
      - name: Integration tests (RLS / envelope / ops)
        run: pnpm test:integration
