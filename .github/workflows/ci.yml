name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm verify
      - name: Synthetic PII / false-inventory scan
        run: pnpm scan:pii
      - name: Dependency audit (fail on high+)
        run: pnpm audit --audit-level=high
      - name: SBOM + provenance
        run: |
          mkdir -p artifacts
          pnpm list --depth 0 --json > artifacts/sbom-deps.json
          echo "digest=$(git rev-parse HEAD)" > artifacts/provenance.txt
          echo "rollback_target=previous-github-actions-artifact" >> artifacts/provenance.txt
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: artifacts/

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealerhire
          POSTGRES_PASSWORD: dealerhire
          POSTGRES_DB: dealerhire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealerhire -d dealerhire"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL_ADMIN: postgres://dealerhire:dealerhire@localhost:5432/dealerhire
      DATABASE_URL: postgres://dealerhire_app:dealerhire_app@localhost:5432/dealerhire
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Integration tests (RLS)
        run: pnpm test:integration
